<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    @page {
      margin: 0.5in;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      margin: 0;
      padding: 0;
      font-size: 10pt;
      color: #222;
      line-height: 1.4;
    }

    h2 {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 18pt;
      font-weight: 300;
      border-bottom: 1px solid #999;
      padding-bottom: 2px;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    p {
      margin: 0 0 8px 0;
    }

    ul {
      margin: 4px 0 10px 0;
      padding-left: 22px;
    }

    ul li {
      margin-bottom: 4px;
      line-height: 1.45;
    }

    .resume-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .resume-name {
      display: block;
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 30pt;
      font-weight: 300;
      margin: 0 0 4px 0;
      line-height: 1;
    }

    .resume-contact {
      display: block;
      font-size: 11pt;
      margin-top: 4px;
    }

    .resume-contact a {
      color: inherit;
      text-decoration: none;
    }

    .spacer {
      margin: 0 10px;
      color: #666;
    }

    .full-page-table {
      width: 100%;
      border-collapse: collapse;
      border: 0;
    }

    .full-page-table td {
      border: 0;
      padding: 0;
      vertical-align: bottom;
    }

    .left-align {
      text-align: left;
    }

    .right-align {
      text-align: right;
      font-size: 10pt;
      white-space: nowrap;
      width: 160px;
    }

    .bold-text {
      font-weight: 700;
      font-size: 12pt;
      color: #486948;
    }

    .page-break {
      page-break-before: always;
      break-before: page;
      padding-top: 10px;
    }
  </style>
</head>
<body>
<!-- RESUME_BODY -->
</body>
</html>
