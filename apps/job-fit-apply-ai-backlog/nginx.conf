server {
    listen 3030;
    listen [::]:3030;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
