name: CI — Test All Packages + Allure Report

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent overlapping runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Web App (Vitest) ─────────────────────────────────────────────────────
  web-app:
    name: Web App — Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/job-backlog-web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/job-backlog-web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:unit
        env:
          CI: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-app
          path: apps/job-backlog-web-app/allure-results
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web-app
          path: apps/job-backlog-web-app/coverage

  # ── 2. Chrome Extension (Jest) ──────────────────────────────────────────────
  extension:
    name: Extension — Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/job-description-to-ai-pipeline-browser-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/job-description-to-ai-pipeline-browser-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-extension
          path: apps/job-description-to-ai-pipeline-browser-extension/allure-results
          if-no-files-found: warn

  # ── 3. Bridge (Kotlin / JUnit 5 + Allure) ───────────────────────────────────
  bridge:
    name: Bridge — Kotlin JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-description-to-ai-pipeline-bridge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-bridge-${{ hashFiles('services/job-description-to-ai-pipeline-bridge/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-bridge-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-bridge
          path: services/job-description-to-ai-pipeline-bridge/build/allure-results
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-bridge
          path: services/job-description-to-ai-pipeline-bridge/build/test-results/test

  # ── 4. Pipeline (Kotlin / JUnit 5 + Allure) ─────────────────────────────────
  pipeline:
    name: Pipeline — Kotlin JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-fit-apply-ai-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-pipeline-${{ hashFiles('services/job-fit-apply-ai-pipeline/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-pipeline-

      - name: Run unit tests
        run: ./gradlew test --tests "com.jd.pipeline.nodes.*" --tests "com.jd.pipeline.cli.*" --tests "com.jd.pipeline.utils.*" --tests "com.jd.pipeline.fixtures.*" --tests "com.jd.pipeline.functional.*"

      - name: Run integration tests
        run: ./gradlew test --tests "com.jd.pipeline.integration.*"
        continue-on-error: true

      - name: JaCoCo coverage report
        run: ./gradlew jacocoTestReport
        if: always()

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-pipeline
          path: services/job-fit-apply-ai-pipeline/build/allure-results
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pipeline
          path: services/job-fit-apply-ai-pipeline/build/reports/jacoco

  # ── 5. Allure Report — collect, generate, publish ───────────────────────────
  allure-report:
    name: Allure Report → GitHub Pages
    runs-on: ubuntu-latest
    needs: [web-app, extension, bridge, pipeline]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Download every allure-results artifact from all jobs
      - name: Download web-app results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-web-app
          path: allure-results/web-app
        continue-on-error: true

      - name: Download extension results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-extension
          path: allure-results/extension
        continue-on-error: true

      - name: Download bridge results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-bridge
          path: allure-results/bridge
        continue-on-error: true

      - name: Download pipeline results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-pipeline
          path: allure-results/pipeline
        continue-on-error: true

      # Merge all sub-directories into one flat allure-results folder
      - name: Merge Allure results
        run: |
          mkdir -p merged-allure-results
          find allure-results -name "*.json" -o -name "*.xml" -o -name "*.txt" -o -name "*.png" \
            | while read f; do cp "$f" merged-allure-results/; done
          echo "Merged $(ls merged-allure-results | wc -l) result files"

      # Restore historical Allure trend from gh-pages
      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - name: Copy history into results
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history merged-allure-results/history || true
          fi

      # Generate the HTML report
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate merged-allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Publish to gh-pages only on pushes to main
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
          commit_message: "ci: publish Allure report for ${{ github.sha }}"
